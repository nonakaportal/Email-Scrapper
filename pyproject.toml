[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadscout"
version = "0.1.0"
description = "Self-hosted B2B lead research and enrichment: OSM discovery, website crawling, public email extraction and verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "email-validator>=2.1",
    "dnspython>=2.6",
    "typer>=0.12",
    "PyYAML>=6.0",
    "phonenumbers>=8.13",
    "tldextract>=5.1",
    "openpyxl>=3.1",
    "overturemaps>=0.10",
    "pyarrow>=15",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.64"]

[project.scripts]
leadscout = "leadscout.cli:app"

[tool.setuptools.packages.find]
include = ["leadscout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
leadscout = ["db/schema.sql"]

# Industries: 50 broad small-business categories, construction first (rank = order).
# Businesses come from Overture Maps (https://overturemaps.org), whose places have a
# category path such as  services_and_business > home_service > plumbing.
#
# overture:  Overture categories (at any level of the path) this industry covers. A business
#            belongs to the industry of the deepest category in its path listed here.
# aliases:   other words users may type for this industry (terminal commands).
# _exclude:  categories that are never leads (banks, hospitals, government ...).

_groups:
  construction: "Construction & Trades"
  home_services: "Home & Property Services"
  professional: "Professional Services"
  healthcare: "Healthcare & Wellness"
  retail: "Retail"
  food: "Food & Hospitality"
  property: "Real Estate & Property"
  automotive: "Automotive & Transportation"
  creative: "Creative & Media"
  personal: "Education & Personal Care"
  industrial: "Industrial, Wholesale & Community"

_exclude: ["atm", "bank_or_credit_union", "money_transfer_service", "check_cashing_payday_loans", "currency_exchange", "holding_company", "private_equity_firm", "hospital", "college_university", "public_school", "elementary_school", "middle_school", "high_school", "charter_school", "government_office", "post_office", "public_utility", "public_transit_facility_or_service", "military_site", "labor_union", "political_organization", "gold_buyer", "coin_dealer", "recycling_center", "donation_center", "mailbox_center"]

